</style></head><body><div id="app"></div><script>
const seed=[
{id:'s1',user:'Noor Daily',handle:'noordaily',type:'reminder',title:'With hardship comes ease',arabic:'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا',subtitle:'Indeed, with hardship comes ease.',ref:'Qur’an 94:5',caption:'A reminder for the days that feel heavy. Keep your trust in Allah.',tags:['Qur’an','Hope'],colors:['#092d28','#206852','#a78d4a'],emoji:'🌙',likes:12840},
{id:'s2',user:'Ayah Reflections',handle:'ayahreflections',type:'quran',title:'A prayer for knowledge',arabic:'رَّبِّ زِدْنِي عِلْمًا',subtitle:'My Lord, increase me in knowledge.',ref:'Qur’an 20:114',caption:'Keep learning. Keep growing. Begin with a sincere intention.',tags:['Qur’an','Learning'],colors:['#102b3a','#235b67','#b49a60'],emoji:'📖',likes:9750},
{id:'s3',user:'The Daily Deen',handle:'dailydeen',type:'reflection',title:'Your small deeds matter',arabic:'الْحَمْدُ لِلَّهِ',subtitle:'Consistency, sincerity, and gratitude turn ordinary moments into opportunities for goodness.',ref:'Reflection · Not a quoted hadith',caption:'What is one good habit you can keep today?',tags:['Reminders','Habits'],colors:['#26213e','#584768','#b68c6c'],emoji:'✨',likes:7921},
{id:'s4',user:'Noor Daily',handle:'noordaily',type:'quran',title:'Hearts find rest',arabic:'أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',subtitle:'Surely in the remembrance of Allah do hearts find comfort.',ref:'Qur’an 13:28 · excerpt',caption:'Make a little room in your day for dhikr.',tags:['Qur’an','Dhikr'],colors:['#112b22','#26655a','#809b5d'],emoji:'🤲',likes:16520},
{id:'s5',user:'Seerah Stories',handle:'seerahstories',type:'history',title:'Curiosity is a good beginning',arabic:'اقْرَأْ',subtitle:'Explore the seerah, ask meaningful questions, and check sources before sharing.',ref:'Learning prompt · Not a quotation',caption:'What topic from Islamic history should we cover next?',tags:['Seerah','Learning'],colors:['#2d2623','#73503e','#b89961'],emoji:'🕌',likes:6120},
{id:'s6',user:'Noor Daily',handle:'noordaily',type:'quran',title:'You are not burdened beyond your capacity',arabic:'لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا',subtitle:'Allah does not require of any soul more than what it can afford.',ref:'Qur’an 2:286 · excerpt',caption:'Turn to Allah and take your next small step.',tags:['Qur’an','Hope'],colors:['#202d43','#3e6577','#c7a36d'],emoji:'🌿',likes:20310},
{id:'s7',user:'Mindful Muslim',handle:'mindfulmuslim',type:'reflection',title:'Put the phone down for salah',arabic:'الصَّلَاةُ',subtitle:'A beautiful feed should help you live your faith — not distract you from it.',ref:'Mindful reminder',caption:'Consider setting a scroll limit and making time for prayer.',tags:['Salah','Reminders'],colors:['#12342c','#357660','#d7b578'],emoji:'☀️',likes:11420}
];
const categories=['All','Qur’an','Reminders','Seerah','Learning','Hope','Dhikr','Salah','Habits'];
const palette=[['#092d28','#206852','#a78d4a'],['#102b3a','#235b67','#b49a60'],['#26213e','#584768','#b68c6c'],['#2d2623','#73503e','#b89961']];
const $=s=>document.querySelector(s); const app=$('#app'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('noor_'+k))??f}catch{return f}};
const state={tab:'reels',posts:read('posts',[]),likes:read('likes',[]),saves:read('saves',[]),follows:read('follows',[]),comments:read('comments',{}),reports:read('reports',[]),category:'All',search:'',selected:'',toast:'',active:0};
const persist=(k,v)=>localStorage.setItem('noor_'+k,JSON.stringify(v)); const all=()=>[...state.posts,...seed].filter(p=>!state.reports.includes(p.id));
const getPost=id=>all().find(p=>p.id===id); const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.0','')+'k':String(n);
const icon={reels:'▣',explore:'⌕',create:'⊕',saved:'♡',profile:'♙'};
function side(){return `<aside class="rail"><div class="brand"><span class="logo">☪</span><span class="name">noor<small>YOUR DAILY LIGHT</small></span></div><nav class="nav">${[['reels','Reels'],['explore','Explore'],['create','Create a post'],['saved','Saved'],['profile','Profile']].map(([id,name])=>`<button class="${state.tab===id?'active':''}" data-tab="${id}"><span class="ico">${icon[id]}</span><span class="label">${name}</span></button>`).join('')}</nav><div class="railfooter"><b>Built for beneficial scrolling.</b><br>Content guidelines prioritize Islamic education, respectful conversations, and reliable sources.<p>Prototype • Local device storage</p></div></aside>`}
function bottomNav(){return `<nav class="bottomNav">${[['reels','Reels'],['explore','Explore'],['create','Create'],['saved','Saved'],['profile','Profile']].map(([id,name])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}"><b>${icon[id]}</b>${name}</button>`).join('')}</nav>`}
function gradient(p){const c=p.colors||palette[0];return `linear-gradient(150deg,${c[0]},${c[1]} 55%,${c[2]})`}
function reel(p,i,total){const liked=state.likes.includes(p.id),saved=state.saves.includes(p.id),followed=state.follows.includes(p.handle);return `<section class="reel" data-id="${esc(p.id)}"><div class="art" style="background:${gradient(p)}"><div class="stars"></div><div class="halo"></div></div>${p.video?`<video class="video" data-video="${esc(p.id)}" playsinline muted loop preload="metadata"></video>`:''}<div class="topbar"><div class="topbrand">☪ noor</div><span class="pill">☪ &nbsp; Faith-filled feed</span><span class="hint">Scroll for the next reel ↓</span></div>${!p.video?`<div class="reelCenter">${p.arabic?`<div class="arabic" lang="ar" dir="rtl">${esc(p.arabic)}</div>`:''}<div class="reelTitle">${esc(p.title)}</div><div class="reelSubtitle">${esc(p.subtitle)}</div><div class="reelRef">${esc(p.ref||'')}</div></div>`:''}<div class="bottom"><div class="author"><div class="avatar">${esc(p.user[0])}</div><span>@${esc(p.handle)}</span>${p.handle!=='you'?`<button class="follow ${followed?'following':''}" data-follow="${esc(p.handle)}">${followed?'Following':'+ Follow'}</button>`:''}</div><div class="captionText">${esc(p.caption)}</div><div class="tags">${p.tags.map(t=>'#'+esc(t.replace(/\W/g,''))).join(' ')}</div></div><div class="actions"><button class="act ${liked?'on':''}" data-like="${esc(p.id)}"><span>${liked?'♥':'♡'}</span>${fmt((p.likes||0)+(liked?1:0))}</button><button class="act" data-comment="${esc(p.id)}"><span>▤</span>${(state.comments[p.id]||[]).length}</button><button class="act ${saved?'on':''}" data-save="${esc(p.id)}"><span>${saved?'◆':'◇'}</span>Save</button><button class="act" data-share="${esc(p.id)}"><span>↗</span>Share</button><button class="act" data-report="${esc(p.id)}"><span>⋯</span>More</button></div><div class="reelCounter">${i+1} / ${total} · Scroll for more</div></section>`}
function reels(list=all()){if(!list.length)return `<div class="view"><div class="empty"><strong>Nothing here yet</strong><p>Explore other categories or create a post.</p></div></div>`;return `<div class="feedWrap" id="feed">${list.map((p,i)=>reel(p,i,list.length)).join('')}</div>`}
function tile(p){return `<button data-open="${esc(p.id)}" class="tile" style="background:${gradient(p)}"><span class="emoji">${esc(p.emoji||'☪')}</span><h3>${esc(p.title)}</h3><p>@${esc(p.handle)} · ${esc(p.tags[0]||'Islamic')}</p></button>`}
function explore(){let list=all().filter(p=>(state.category==='All'||p.tags.includes(state.category))&&[p.title,p.subtitle,p.caption,p.user,p.tags.join(' ')].join(' ').toLowerCase().includes(state.search.toLowerCase()));return `<div class="view"><h1>Explore goodness ✨</h1><p class="lead">Discover Qur’an reflections, lessons, Islamic history, and mindful reminders.</p><div class="searchBox"><span>⌕</span><input id="search" placeholder="Search topics, posts, creators..." value="${esc(state.search)}"></div><div class="chips">${categories.map(c=>`<button data-category="${esc(c)}" class="chip ${state.category===c?'selected':''}">${esc(c)}</button>`).join('')}</div>${list.length?`<div class="grid">${list.map(tile).join('')}</div>`:'<div class="noResults">No posts found. Try a different search.</div>'}</div>`}
function create(){return `<div class="view"><h1>Share something beneficial</h1><p class="lead">Post an Islamic reminder or upload your own short video.</p><form id="postForm" class="compose"><div class="field"><label>Post title *</label><input name="title" maxlength="100" required placeholder="A reminder worth sharing"></div><div class="field"><label>Caption *</label><textarea name="caption" maxlength="700" required placeholder="What would you like to share?"></textarea></div><div class="field"><label>Category *</label><select name="category">${categories.filter(x=>x!=='All').map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Text to display on the reel (for text posts)</label><textarea name="subtitle" maxlength="350" placeholder="Your short message"></textarea></div><div class="field"><label>Optional source/reference</label><input name="reference" maxlength="120" placeholder="e.g. Qur’an 94:5 — only if accurate"></div><div class="field"><label>Upload a video (optional)</label><div class="upload">🎬 &nbsp; Select an MP4, MOV, or WebM video<br><br><input id="videoInput" type="file" accept="video/mp4,video/webm,video/quicktime,video/*"><p style="font-size:12px">Max 100 MB · Videos remain on this device in this prototype.</p></div></div><div class="notice">Only share Islamically appropriate, respectful material. Verify quotations and references before publishing. This demo does not have live moderation or public uploads.</div><button class="primary" type="submit">Publish to my feed ↗</button></form></div>`}
function saved(){let list=all().filter(p=>state.saves.includes(p.id));return `<div class="view"><h1>Saved posts ♡</h1><p class="lead">A collection of reminders worth revisiting.</p>${list.length?`<div class="grid">${list.map(tile).join('')}</div>`:`<div class="empty"><strong>Your collection begins here.</strong><p>Tap the Save icon on any reel to keep it here.</p><button class="primary" data-tab="reels">Browse reels</button></div>`}</div>`}
function profile(){return `<div class="view"><div class="profileHead"><div class="avatar">Y</div><div><h2>@you</h2><p>Your space for sharing beneficial content</p></div></div><div class="statRow"><div class="stat"><strong>${state.posts.length}</strong><span>Posts</span></div><div class="stat"><strong>${state.follows.length}</strong><span>Following</span></div><div class="stat"><strong>${state.saves.length}</strong><span>Saved</span></div></div><button class="primary" data-tab="create">+ Create a post</button><h3 class="sectionTitle">Your posts</h3>${state.posts.length?`<div class="grid">${state.posts.map(tile).join('')}</div>`:`<div class="empty"><strong>Make your first post.</strong><p>Share something that reminds people of goodness.</p></div>`}<div class="notice"><b>About this prototype:</b> Likes, follows, comments, and your posts are saved locally on this device. There are no real user accounts or cloud synchronization yet.</div></div>`}
function render(keepScroll=false){let old=keepScroll?$('#feed')?.scrollTop:0;app.innerHTML=side()+`<main class="main">${state.tab==='reels'?reels():state.tab==='explore'?explore():state.tab==='create'?create():state.tab==='saved'?saved():profile()}</main>`+bottomNav();if(keepScroll&&$('#feed'))$('#feed').scrollTop=old;loadVideos();observeVideos()}
function toast(msg){$('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function toggle(key,id){state[key]=state[key].includes(id)?state[key].filter(x=>x!==id):[...state[key],id];persist(key,state[key]);render(true)}
function modal(content){$('.modalOverlay')?.remove();let o=document.createElement('div');o.className='modalOverlay';o.innerHTML=`<div class="modal">${content}</div>`;o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-close]'))o.remove()});document.body.append(o)}
function comments(id){const p=getPost(id);if(!p)return;const list=state.comments[id]||[];modal(`<div class="modalHead"><h2>Comments · ${esc(p.title)}</h2><button class="x" data-close>×</button></div><div class="commentList">${list.length?list.map(x=>`<div class="comment"><b>@you</b><p>${esc(x.text)}</p><small class="muted">${esc(x.date)}</small></div>`).join(''):'<p class="muted">No comments yet. Start a respectful conversation.</p>'}</div><form id="commentForm" data-id="${esc(id)}" class="commentEntry"><input name="comment" required maxlength="250" placeholder="Write a kind comment..."><button class="primary">Post</button></form>`)}
function more(id){const p=getPost(id);modal(`<div class="modalHead"><h2>Post options</h2><button class="x" data-close>×</button></div><p class="muted">${esc(p?.title||'Post')}</p><button class="secondary" style="width:100%;margin-bottom:12px" data-action="report" data-id="${esc(id)}">Report or hide this post</button>${p?.handle==='you'?`<button class="secondary" style="width:100%" data-action="delete" data-id="${esc(id)}">Delete my post</button>`:''}<p class="muted" style="font-size:12px">Reporting hides a post on this device. Public moderation will require a backend.</p>`)}
// IndexedDB stores video blobs (localStorage is too small for video files).
function db(){return new Promise((res,rej)=>{let r=indexedDB.open('noor_media',1);r.onupgradeneeded=()=>r.result.createObjectStore('videos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function storeVideo(id,file){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('videos','readwrite');t.objectStore('videos').put(file,id);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}
async function removeVideo(id){const d=await db();const t=d.transaction('videos','readwrite');t.objectStore('videos').delete(id);t.oncomplete=()=>d.close()}
async function loadVideos(){if(!document.querySelector('[data-video]'))return;try{const d=await db();for(const v of document.querySelectorAll('[data-video]')){const id=v.dataset.video;const file=await new Promise(res=>{let r=d.transaction('videos').objectStore('videos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)});if(file&&document.contains(v)){v.src=URL.createObjectURL(file);v.addEventListener('loadeddata',()=>{if(v.closest('.reel')?.getBoundingClientRect().top===0)v.play().catch(()=>{})},{once:true})}}d.close()}catch(e){console.warn('Local video loading unavailable',e)}}
let observer;function observeVideos(){observer?.disconnect();observer=new IntersectionObserver(entries=>{entries.forEach(e=>{let v=e.target.querySelector('video');if(v){if(e.isIntersecting)v.play().catch(()=>{});else v.pause()}})},{threshold:.6});document.querySelectorAll('.reel').forEach(e=>observer.observe(e))}
function showPost(id){const list=all();const index=list.findIndex(p=>p.id===id);state.tab='reels';render();if(index>=0)$('#feed').scrollTop=index*$('#feed').clientHeight}
document.addEventListener('click',async e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.tab){state.tab=el.dataset.tab;render();return}if(el.dataset.category){state.category=el.dataset.category;render();$('#search')?.focus();return}if(el.dataset.open){showPost(el.dataset.open);return}if(el.dataset.like){toggle('likes',el.dataset.like);return}if(el.dataset.save){let was=state.saves.includes(el.dataset.save);toggle('saves',el.dataset.save);toast(was?'Removed from saved':'Saved for later ♡');return}if(el.dataset.follow){toggle('follows',el.dataset.follow);return}if(el.dataset.comment){comments(el.dataset.comment);return}if(el.dataset.report){more(el.dataset.report);return}if(el.dataset.share){const id=el.dataset.share;const url=location.origin+location.pathname+'#post='+encodeURIComponent(id);try{await navigator.clipboard.writeText(url);toast('Post link copied')}catch{toast('Sharing is unavailable here')}return}if(el.dataset.action==='report'){state.reports.push(el.dataset.id);persist('reports',state.reports);$('.modalOverlay')?.remove();render();toast('Post hidden on this device');return}if(el.dataset.action==='delete'){state.posts=state.posts.filter(p=>p.id!==el.dataset.id);persist('posts',state.posts);await removeVideo(el.dataset.id).catch(()=>{});$('.modalOverlay')?.remove();render();toast('Post deleted')}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;const focused=true;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',async e=>{if(e.target.id==='commentForm'){e.preventDefault();const id=e.target.dataset.id,text=e.target.comment.value.trim();if(!text)return;state.comments[id]=[...(state.comments[id]||[]),{text,date:new Date().toLocaleDateString()}];persist('comments',state.comments);comments(id);toast('Comment added locally');return}if(e.target.id==='postForm'){e.preventDefault();const f=e.target,form=new FormData(f),file=$('#videoInput')?.files?.[0],title=String(form.get('title')||'').trim(),caption=String(form.get('caption')||'').trim();if(!title||!caption)return;if(file&&file.size>100*1024*1024){toast('Please choose a video under 100 MB');return}const id='p'+Date.now(),cat=String(form.get('category')),post={id,user:'You',handle:'you',title,caption,subtitle:String(form.get('subtitle')||''),ref:String(form.get('reference')||''),tags:[cat],colors:palette[Math.floor(Math.random()*palette.length)],emoji:'☪',video:!!file,likes:0};try{if(file)await storeVideo(id,file);state.posts.unshift(post);persist('posts',state.posts);state.tab='reels';render();toast('Published to your local feed ✨')}catch(err){toast('Could not save post; check browser storage')}}});
window.addEventListener('hashchange',()=>{let m=location.hash.match(/^#post=(.+)$/);if(m)showPost(decodeURIComponent(m[1]))});render();if(location.hash.startsWith('#post='))showPost(decodeURIComponent(location.hash.slice(6)));
</script></body></html>
